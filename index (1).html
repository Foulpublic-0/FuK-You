<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinematic Explosion Intro</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#050505;
    font-family:Arial, sans-serif;
}

.scene{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 60%,
        #222 0%,
        #090909 35%,
        #020202 75%);
}

/* ---------------- GRENADE ---------------- */

.grenade{
    position:absolute;
    left:50%;
    top:-100px;

    width:48px;
    height:62px;

    background:
        linear-gradient(90deg,
        #111 0%,
        #3c4239 45%,
        #151815 100%);

    border-radius:45% 45% 40% 40%;

    box-shadow:
        inset -8px -5px 10px #000,
        inset 5px 4px 8px #666;

    transform:translateX(-50%) rotate(-25deg);

    animation:
        grenadeFly 1.8s cubic-bezier(.18,.72,.25,1) forwards;
    z-index:20;
}

/* top cap */
.grenade::before{
    content:"";
    position:absolute;

    width:22px;
    height:12px;

    left:13px;
    top:-7px;

    background:#343832;
    border-radius:4px;

    box-shadow:inset 0 -3px 3px #111;
}

/* pin */
.grenade::after{
    content:"";
    position:absolute;

    width:18px;
    height:10px;

    left:18px;
    top:-16px;

    border:3px solid #aaa;
    border-bottom:0;
    border-radius:10px 10px 0 0;

    transform:rotate(-20deg);
}


/* ---------------- IMPACT FLASH ---------------- */

.flash{
    position:absolute;

    left:50%;
    top:58%;

    width:30px;
    height:30px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 20px #fff,
        0 0 70px #ffb300,
        0 0 150px #ff5e00;

    opacity:0;

    transform:translate(-50%,-50%);

    animation:flash 0.35s 1.72s ease-out forwards;

    z-index:15;
}


/* ---------------- FIREBALL ---------------- */

.fireball{
    position:absolute;

    left:50%;
    top:58%;

    width:40px;
    height:40px;

    border-radius:50%;

    background:
        radial-gradient(circle,
        #fff 0%,
        #ffe082 12%,
        #ff9800 35%,
        #e65100 65%,
        transparent 75%);

    opacity:0;

    transform:translate(-50%,-50%);

    filter:blur(1px);

    animation:fireball 1s 1.78s ease-out forwards;

    z-index:12;
}


/* ---------------- OUTER FLAME ---------------- */

.flame{
    position:absolute;

    left:50%;
    top:58%;

    width:80px;
    height:80px;

    border-radius:50% 45% 55% 40%;

    background:
        radial-gradient(circle,
        #ffcc80 0%,
        #ff6d00 30%,
        #d84315 60%,
        transparent 72%);

    opacity:0;

    transform:translate(-50%,-50%);

    filter:blur(3px);

    animation:flame 1.2s 1.8s ease-out forwards;

    z-index:11;
}


/* ---------------- SMOKE ---------------- */

.smoke{
    position:absolute;

    left:50%;
    top:58%;

    width:120px;
    height:100px;

    border-radius:50%;

    background:
        radial-gradient(circle,
        #777 0%,
        #444 35%,
        #181818 70%,
        transparent 72%);

    opacity:0;

    filter:blur(12px);

    transform:translate(-50%,-50%);

    animation:smoke 3.5s 2s ease-out forwards;

    z-index:9;
}

.smoke2{
    position:absolute;

    left:45%;
    top:60%;

    width:100px;
    height:90px;

    border-radius:50%;

    background:#303030;

    opacity:0;

    filter:blur(15px);

    animation:smoke2 3s 2.1s ease-out forwards;

    z-index:8;
}


/* ---------------- SHOCKWAVE ---------------- */

.shockwave{
    position:absolute;

    left:50%;
    top:58%;

    width:50px;
    height:25px;

    border:5px solid rgba(255,180,60,.8);

    border-radius:50%;

    opacity:0;

    transform:translate(-50%,-50%);

    animation:shockwave .9s 1.8s ease-out forwards;

    z-index:7;
}


/* ---------------- DEBRIS ---------------- */

.debris{
    position:absolute;

    left:50%;
    top:58%;

    width:6px;
    height:6px;

    background:#aaa;
    border-radius:50%;

    opacity:0;

    animation:debris 1s 1.8s ease-out forwards;

    z-index:10;
}

.d1{ --x:150px; --y:-100px; }
.d2{ --x:-140px; --y:-80px; }
.d3{ --x:110px; --y:70px; }
.d4{ --x:-100px; --y:80px; }
.d5{ --x:190px; --y:-20px; }
.d6{ --x:-190px; --y:-30px; }


/* ---------------- NAME ---------------- */

.name{
    position:absolute;

    left:50%;
    top:58%;

    transform:
        translate(-50%,-50%)
        scale(.5);

    color:white;

    font-size:clamp(45px,9vw,110px);

    font-weight:900;

    letter-spacing:12px;

    text-transform:uppercase;

    opacity:0;

    text-shadow:
        0 0 5px white,
        0 0 20px #ff9800,
        0 0 45px #ff5722,
        0 0 80px #ff3300;

    animation:
        nameReveal 1.3s 2.35s cubic-bezier(.16,1.2,.3,1) forwards;

    z-index:30;
}


/* ---------------- CAMERA SHAKE ---------------- */

.scene{
    animation:cameraShake .5s 1.75s ease-out;
}


/* ---------------- ANIMATIONS ---------------- */

@keyframes grenadeFly{

    0%{
        top:-100px;
        transform:
            translateX(-50%)
            rotate(-40deg);
    }

    65%{
        top:48%;
        transform:
            translateX(-50%)
            rotate(300deg);
    }

    82%{
        top:60%;
        transform:
            translateX(-50%)
            rotate(360deg);
    }

    90%{
        top:55%;
    }

    100%{
        top:58%;
        opacity:0;
        transform:
            translateX(-50%)
            rotate(380deg)
            scale(.7);
    }
}


@keyframes flash{

    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.2);
    }

    20%{
        opacity:1;
        transform:translate(-50%,-50%) scale(5);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(8);
    }
}


@keyframes fireball{

    0%{
        opacity:1;
        transform:translate(-50%,-50%) scale(.2);
    }

    35%{
        opacity:1;
        transform:translate(-50%,-50%) scale(4);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(6);
    }
}


@keyframes flame{

    0%{
        opacity:1;
        transform:translate(-50%,-50%) scale(.3);
    }

    35%{
        opacity:1;
        transform:translate(-50%,-50%) scale(3);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(4.5);
    }
}


@keyframes smoke{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.4);
    }

    25%{
        opacity:.8;
    }

    100%{
        opacity:.75;
        transform:
            translate(-45%,-90%)
            scale(4);
    }
}


@keyframes smoke2{

    0%{
        opacity:0;
        transform:scale(.3);
    }

    30%{
        opacity:.8;
    }

    100%{
        opacity:0;
        transform:
            translate(-20px,-100px)
            scale(3.5);
    }
}


@keyframes shockwave{

    0%{
        opacity:1;
        width:30px;
        height:20px;
    }

    100%{
        opacity:0;
        width:500px;
        height:180px;
    }
}


@keyframes debris{

    0%{
        opacity:1;
        transform:translate(0,0) scale(1);
    }

    100%{
        opacity:0;
        transform:
            translate(var(--x),var(--y))
            scale(.2);
    }
}


@keyframes cameraShake{

    0%{ transform:translate(0,0); }
    15%{ transform:translate(-8px,5px); }
    30%{ transform:translate(7px,-6px); }
    45%{ transform:translate(-6px,-3px); }
    60%{ transform:translate(5px,6px); }
    75%{ transform:translate(-3px,-4px); }
    100%{ transform:translate(0,0); }
}


@keyframes nameReveal{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.3);
        filter:blur(15px);
    }

    55%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.12);
        filter:blur(0);
    }

    100%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1);
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="grenade"></div>

    <div class="flash"></div>

    <div class="fireball"></div>

    <div class="flame"></div>

    <div class="smoke"></div>
    <div class="smoke2"></div>

    <div class="shockwave"></div>

    <div class="debris d1"></div>
    <div class="debris d2"></div>
    <div class="debris d3"></div>
    <div class="debris d4"></div>
    <div class="debris d5"></div>
    <div class="debris d6"></div>

    <!-- নিজের নাম এখানে লিখুন -->
    <div class="name">🖕
    Fuck you</div>

</div>

</body>
</html>
